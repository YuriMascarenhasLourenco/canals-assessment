services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - canals_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d canals_orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: dockerfile
      target: build
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy &&
             npx prisma db seed"

  api:
    build:
      context: .
      dockerfile: dockerfile
      target: production
    environment:
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      MOCK_PAYMENT_DECLINE_SUFFIXES: ${MOCK_PAYMENT_DECLINE_SUFFIXES}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    command: ["node", "dist/src/main.js"]

volumes:
  canals_pg_data: